service: repairs-listener
provider:
  name: aws
  runtime: dotnet8
  memorySize: 2048
  vpc: ${self:custom.vpc.${opt:stage}}
  stage: ${opt:stage}
  region: eu-west-2
  timeout: 15
  usagePlan:
    - secureAccess:
        throttle:
          burstLimit: 200
          rateLimit: 100
  tracing:
    lambda: true
  versionFunctions: false

package:
  artifact: ./bin/release/net8.0/repairs-listener.zip

functions:
  RepairsListener:
    name: ${self:service}-${self:provider.stage}
    handler: RepairsListener::RepairsListener.SqsFunction::FunctionHandler
    role: lambdaExecutionRole
    environment:
      REPAIRS_DB_CONNECTION_STRING: Host=${ssm:/repairs-api/${self:provider.stage}/postgres-hostname};Port=${ssm:/repairs-api/${self:provider.stage}/postgres-port};Database=${ssm:/repairs-api/${self:provider.stage}/postgres-database};Username=${ssm:/repairs-api/${self:provider.stage}/postgres-username};Password=${ssm:/repairs-api/${self:provider.stage}/postgres-password}
    events:
      ### Specify the parameter containing the queue arn used to trigget the lambda function here
      ### This will have been defined in the terraform configuration
       - sqs: ${ssm:/sqs-queue/${self:provider.stage}/repairshubinbound/arn}

resources:
  Resources:
    lambdaExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        Path: /${self:service}/${self:provider.stage}/
        RoleName: ${self:service}-lambdaExecutionRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
          - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        Policies:
          - PolicyName: manageLogs
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - 'Fn::Join':
                        - ':'
                        - - 'arn:aws:logs'
                          - Ref: 'AWS::Region'
                          - Ref: 'AWS::AccountId'
                          - 'log-group:/aws/lambda/*:*:*'
                # - Effect: "Allow"
                #   Action:
                #     - "s3:PutObject"
                #     - "s3:GetObject"
                #   Resource:
                #     Fn::Join:
                #       - ""
                #       - - "arn:aws:s3:::"
                #         - "Ref": "ServerlessDeploymentBucket"
          - PolicyName: lambdaInvocation
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - "lambda:InvokeFunction"
                  Resource: "*"
          - PolicyName: sqsAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - "sqs:ChangeMessageVisibility"
                    - "sqs:DeleteMessage"
                    - "sqs:GetQueueAttributes"
                    - "sqs:GetQueueUrl"
                    - "sqs:ListQueueTags"
                    - "sqs:ReceiveMessage"
                    - "sqs:SendMessage"
                    - "kms:Decrypt"
                  Resource: "*"

custom:
  vpc:
    production:
      securityGroupIds:
        - sg-0b7be628d680f9e5f
      subnetIds:
        - subnet-05e595c59b7d6c8df
        - subnet-0e6bc9b4ac24493cc
